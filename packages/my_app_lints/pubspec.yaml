# pubspec.yaml
name: my_app_lints
description: Custom lints für mein Flutter-Template
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  # we will use analyzer for inspecting Dart files
  analyzer: ^8.0.0
  analyzer_plugin: ^0.13.5
  # custom_lint_builder will give us tools for writing lints
  custom_lint_builder: ^0.8.1
